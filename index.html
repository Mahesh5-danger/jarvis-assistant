
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS AI</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#050b16;
 color:#eaf6ff;
 font-family:Arial,sans-serif;
 min-height:100vh;
 text-align:center;
}
header{
 padding:25px 15px;
 color:#35d9ff;
 letter-spacing:5px;
 font-size:27px;
 font-weight:bold;
}
.status{color:#75a9c5;font-size:12px;letter-spacing:2px}
.circle{
 width:190px;height:190px;
 border:2px solid #19cfff;
 border-radius:50%;
 margin:35px auto 20px;
 display:flex;
 align-items:center;
 justify-content:center;
 box-shadow:0 0 25px #087ca8, inset 0 0 25px #087ca8;
}
.core{
 width:115px;height:115px;
 border:3px solid #48dcff;
 border-radius:50%;
 box-shadow:0 0 30px #16cfff;
 animation:pulse 2s infinite;
}
@keyframes pulse{
 50%{transform:scale(1.12);opacity:.6}
}
h2{color:#43dfff;font-size:18px}
#chat{
 margin:25px 15px;
 padding:15px;
 min-height:120px;
 max-height:260px;
 overflow:auto;
 border:1px solid #17445f;
 border-radius:12px;
 text-align:left;
 background:#091526;
}
.message{padding:9px;margin:7px 0;border-radius:8px}
.user{background:#123b58}
.jarvis{background:#102b32;color:#71e8ff}
input{
 width:68%;padding:14px;
 border:1px solid #1b9ecb;
 border-radius:10px;
 background:#0c1b2b;color:white;
 font-size:15px;
}
button{
 padding:13px;
 margin:5px;
 border:1px solid #20cfff;
 border-radius:10px;
 background:#09253a;
 color:#50dfff;
 font-weight:bold;
}
#mic{width:65px;height:65px;border-radius:50%;font-size:25px}
footer{padding:25px;color:#55758a;font-size:12px}
</style>
</head>
<body>

<header>J.A.R.V.I.S</header>
<div class="status">PERSONAL AI ASSISTANT</div>

<div class="circle">
 <div class="core"></div>
</div>

<h2>SYSTEM ONLINE</h2>
<p class="status">AWAITING YOUR COMMAND</p>

<div id="chat">
 <div class="message jarvis">
 JARVIS: Hello! Your assistant interface is ready.
 </div>
</div>

<div>
 <input id="command" placeholder="Type your command...">
 <button onclick="sendMessage()">SEND</button>
</div>

<br>
 <button id="mic" onclick="listen()">🎙</button>

<br>
<button id="voiceMode" onclick="toggleVoiceMode()">
START VOICE CONVERSATION
</button>

<p class="status" id="status">TAP MICROPHONE TO SPEAK</p>

 <h2>MY TASK MANAGER</h2>

<div id="taskManager">
  <input id="taskInput" placeholder="Enter a task...">
  <button onclick="addTask()">ADD TASK</button>
  <div id="taskList"></div>
</div>

<footer>JARVIS AI • PERSONAL PROJECT</footer>

<script>
const chat = document.getElementById("chat");
let voiceMode = false;
 let conversationMemory = [];
let activeRecognition = null;

function addMessage(text, type) {
  const div = document.createElement("div");
  div.className = "message " + type;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function speak(text) {
  if (!("speechSynthesis" in window)) return;

  speechSynthesis.cancel();

  const voice = new SpeechSynthesisUtterance(text);
  voice.rate = 1;

  voice.onend = () => {
    if (voiceMode && !activeRecognition) {
      listen();
    }
  };

  voice.onerror = () => {
    if (!voiceMode) return;
  };

  speechSynthesis.speak(voice);
 }

function toggleVoiceMode() {
  const button = document.getElementById("voiceMode");
  voiceMode = !voiceMode;

  if (voiceMode) {
    button.textContent = "STOP VOICE CONVERSATION";
    document.getElementById("status").textContent = "VOICE MODE ON";
    speak("Voice conversation mode activated. How can I help you?");
  } else {
    button.textContent = "START VOICE CONVERSATION";
    document.getElementById("status").textContent = "SYSTEM ONLINE";
    speechSynthesis.cancel();

    if (activeRecognition) {
      activeRecognition.onend = null;
      activeRecognition.stop();
      activeRecognition = null;
    }
  }
}

async function sendMessage() {
  const input = document.getElementById("command");
  const text = input.value.trim();
  if (!text) return;

  addMessage("YOU: " + text, "user");
  input.value = "";

  let reply = "";
  const command = text.toLowerCase();

  if (command.includes("time")) {
    reply = "The time is " + new Date().toLocaleTimeString();
  } else if (command.includes("date")) {
  } else if (command.includes("open youtube")) {
  reply = "Opening YouTube.";
  window.open("https://www.youtube.com", "_blank");

} else if (
  command.startsWith("search ") ||
  command.startsWith("look up ")
) {
  const query = text.replace(/^(search|look up)\s+/i, "").trim();

  if (query) {
    reply = "Opening web search results for " + query;
    window.open(
      "https://www.google.com/search?q=" + encodeURIComponent(query),
      "_blank"
    );
  } else {
    reply = "Please tell me what you want to search for.";
  }

} else {
  const match = text.match(  reply = "Today is " + new Date().toLocaleDateString();
  
      /(-?\d+(?:\.\d+)?)\s*(plus|add|minus|subtract|times|multiply|multiplied by|divide|divided by|\+|-|\*|\/)\s*(-?\d+(?:\.\d+)?)/i
    );

    try {
      if (match) {
        const operations = {
          plus: "add", add: "add", "+": "add",
          minus: "subtract", subtract: "subtract", "-": "subtract",
          times: "multiply", multiply: "multiply", "*": "multiply",
          "multiplied by": "multiply",
          divide: "divide", "divided by": "divide", "/": "divide"
        };

        const response = await fetch(
          "https://jarvis-ai-backend-vc5c.onrender.com/calculate",
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
  a: Number(match[1]),
  b: Number(match[3]),
  operation: operations[match[2].toLowerCase()]
})
          }
        );

        const data = await response.json();
        if (!response.ok) throw new Error("Calculator error");
        reply = "The answer is " + data.result;
      } else {
        const response = await fetch(
          "https://jarvis-ai-backend-vc5c.onrender.com/chat",
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
  message: text,
  history: conversationMemory
})
          }
        );

        const data = await response.json();
        if (!response.ok) throw new Error("Server error");
        reply = data.reply || "I received your message.";

conversationMemory.push(
  { role: "user", text: text },
  { role: "model", text: reply }
);

conversationMemory = conversationMemory.slice(-12);
      }
    } catch (error) {
      reply = "I cannot connect to my tools right now. Please try again.";
    }
  }

  addMessage("JARVIS: " + reply, "jarvis");
  speak(reply);
}

function listen() {
  const SpeechRecognition =
    window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    alert("Voice recognition is not supported. Try Google Chrome.");
    voiceMode = false;
    document.getElementById("voiceMode").textContent =
      "START VOICE CONVERSATION";
    return;
  }

  if (activeRecognition) return;

  const recognition = new SpeechRecognition();
  activeRecognition = recognition;
  recognition.lang = "en-IN";

  recognition.onstart = () => {
    document.getElementById("status").textContent = "LISTENING...";
  };

  recognition.onresult = (event) => {
    document.getElementById("command").value =
      event.results[0][0].transcript;
    sendMessage();
  };

  recognition.onerror = () => {
    document.getElementById("status").textContent = "VOICE INPUT ERROR";
  };

  recognition.onend = () => {
    activeRecognition = null;
    if (!voiceMode) {
      document.getElementById("status").textContent = "SYSTEM ONLINE";
    }
  };

  recognition.start();
}

let tasks = JSON.parse(localStorage.getItem("jarvisTasks") || "[]");

function showTasks() {
  const list = document.getElementById("taskList");
  list.innerHTML = "";

  tasks.forEach((task, index) => {
    const item = document.createElement("p");
    item.textContent = (task.done ? "✅ " : "📝 ") + task.text;

    const doneButton = document.createElement("button");
    doneButton.textContent = task.done ? "Undo" : "Done";
    doneButton.onclick = () => {
      tasks[index].done = !tasks[index].done;
      saveTasks();
    };

    const deleteButton = document.createElement("button");
    deleteButton.textContent = "Delete";
    deleteButton.onclick = () => {
      tasks.splice(index, 1);
      saveTasks();
    };

    item.appendChild(doneButton);
    item.appendChild(deleteButton);
    list.appendChild(item);
  });
}

function addTask() {
  const input = document.getElementById("taskInput");
  const text = input.value.trim();
  if (!text) return;

  tasks.push({ text: text, done: false });
  input.value = "";
  saveTasks();
}

function saveTasks() {
  localStorage.setItem("jarvisTasks", JSON.stringify(tasks));
  showTasks();
}

showTasks();



        

  


</script>
</body>
</html>
